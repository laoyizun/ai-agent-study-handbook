<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记忆卡片库 · 数据概览</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- ============ 顶部导航 ============ -->
<header class="admin-topbar">
  <a class="brand" href="../index.html">用 AI Agent 学学习</a>
  <a class="back" href="index.html">← 返回数据概览</a>
</header>

<main class="admin-container">

  <!-- ============ 头部 ============ -->
  <section class="admin-head">
    <h1 class="admin-title">🃏 记忆卡片库</h1>
    <p class="admin-desc">大家加入的记忆卡片都在这里。点名字标签筛选 · 点卡片翻面看答案 · 选中「我是谁」后可以编辑和删除自己的卡片。</p>
    <div class="admin-meta">
      <span id="last-updated" class="meta-pill">加载中...</span>
      <button id="refresh-btn" class="refresh-btn">🔄 刷新</button>
      <a class="refresh-btn entry-btn" href="logs.html">🧾 修改日志 →</a>
    </div>
  </section>

  <!-- ============ 身份选择（决定哪些卡可以改） ============ -->
  <section class="filter-bar identity-bar">
    <div class="filter-label">✏️ 我是谁</div>
    <div class="identity-wrap">
      <select id="identity-select" class="search-input identity-select">
        <option value="">— 不设置（只读浏览）—</option>
      </select>
      <span class="identity-hint" id="identity-hint">选好名字后，只有这个人的卡片上会出现编辑和删除按钮</span>
    </div>
  </section>

  <!-- ============ 名字筛选标签 ============ -->
  <section class="filter-bar">
    <div class="filter-label">👤 按名字筛选</div>
    <div id="name-tabs" class="name-tabs">
      <div class="empty-row">加载中...</div>
    </div>
  </section>

  <!-- ============ 关键词搜索 ============ -->
  <section class="filter-bar">
    <div class="filter-label">🔍 关键词</div>
    <input id="search-input" class="search-input" type="search" placeholder="输入问题或答案里的关键词..." autocomplete="off">
  </section>

  <!-- ============ 当前筛选统计 ============ -->
  <section class="cards-stat" id="cards-stat"></section>

  <!-- ============ 卡片网格 ============ -->
  <section id="card-grid" class="card-grid">
    <div class="empty-row">加载中...</div>
  </section>

  <!-- ============ 编辑弹窗 ============ -->
  <div class="modal-backdrop" id="edit-modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
      <h2 class="modal-title" id="edit-modal-title">✏️ 编辑卡片</h2>
      <p class="modal-sub" id="edit-modal-sub"></p>

      <div class="form-field">
        <label for="edit-subject">学科 subject</label>
        <input id="edit-subject" class="search-input" type="text" placeholder="例如 数学">
      </div>

      <div class="form-field">
        <label for="edit-question">问题 question</label>
        <textarea id="edit-question" class="search-input" rows="3" placeholder="卡片正面"></textarea>
      </div>

      <div class="form-field">
        <label for="edit-answer">答案 answer</label>
        <textarea id="edit-answer" class="search-input" rows="3" placeholder="卡片反面"></textarea>
      </div>

      <div class="form-field">
        <label for="edit-weakness">
          卡点 weakness
          <span class="field-tag">L7 新增</span>
        </label>
        <textarea id="edit-weakness" class="search-input" rows="2" placeholder="我总是漏掉摩擦力方向"></textarea>
        <span class="field-hint">写你<strong>卡在哪一步</strong>，不是"不熟悉"这种空话。留空也行——“NULL”和"没有卡点"是两件事。</span>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="edit-cancel">取消</button>
        <button class="btn btn-primary" id="edit-save">保存</button>
      </div>
    </div>
  </div>

  <!-- ============ 删除确认弹窗 ============ -->
  <div class="modal-backdrop" id="delete-modal" hidden>
    <div class="modal-box modal-box--danger" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
      <h2 class="modal-title" id="delete-modal-title">🗑️ 删除卡片</h2>
      <p class="modal-sub" id="delete-modal-sub"></p>
      <div class="delete-warn">
        <p>⚠️ 删除后，这张卡的<strong>复习标记也会一起消失</strong>（数据库里是自动的，不会留得下脏数据）。</p>
        <p>删了就没了。确认确定要删吗？</p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="delete-cancel">取消</button>
        <button class="btn btn-danger" id="delete-confirm">确认删除</button>
      </div>
    </div>
  </div>

  <!-- ============ 提示条 ============ -->
  <div class="toast" id="toast" hidden></div>

</main>

<script src="js/cards-view.js"></script>
</body>
</html>
